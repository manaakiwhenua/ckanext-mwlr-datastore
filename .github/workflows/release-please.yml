name: Release pull request

# The release pull request model (CICD-ADR-010) on GitHub. Every merge to main
# updates one open pull request titled for the next version, computed from the
# conventional commits since the last release. Merging that pull request IS the
# release: it writes the version to pyproject.toml and CHANGELOG.md, tags
# vX.Y.Z and publishes the GitHub release. Nothing is ever pushed to main
# directly, so branch protection is untouched.
#
# The token: a GitHub App or fine-grained PAT stored as RELEASE_PLEASE_TOKEN
# so the release pull request triggers the test workflow (pull requests opened
# with GITHUB_TOKEN do not). Falls back to GITHUB_TOKEN until that is set.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
