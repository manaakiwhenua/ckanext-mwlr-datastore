name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (CKAN ${{ matrix.ckan }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.12 is what the DataStore image runs from September 2026; 2.10 stays
        # until production has moved (MWDS-359).
        include:
          - ckan: "2.12"
            plugins: "mwlr_datastore tracking dataset_approval scheming_datasets"
          - ckan: "2.10"
            plugins: "mwlr_datastore dataset_approval scheming_datasets"
    container:
      image: ckan/ckan-dev:${{ matrix.ckan }}
      # The 2.11+ dev images end on USER ckan; the runner's checkout and state
      # files need root inside the container.
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1
    steps:
      - uses: actions/checkout@v4
      - name: Install the extension and its test requirements
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install -e .
      - name: Point test.ini at the container's CKAN and the plugin set for this CKAN
        run: |
          sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini
          sed -i -e 's/^ckan.plugins = .*/ckan.plugins = ${{ matrix.plugins }}/' test.ini
          ckan -c test.ini db init
      - name: Run the tests
        run: pytest --ckan-ini=test.ini --cov=ckanext.mwlr_datastore --cov=ckanext.datasetapproval --cov-report=term-missing --disable-warnings ckanext/mwlr_datastore ckanext/datasetapproval

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.13.0"

  package:
    name: package (sdist installs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Install the sdist into a clean environment and check every template and asset shipped
        # Catches files missing from MANIFEST.in. It compares the whole of
        # templates/ and public/ in the checkout against what the installed
        # package actually has, rather than a hand-kept list: MWDS-438 added
        # templates/home/robots.txt, the mwlr_datastore include line had no
        # *.txt, and the old three-file check passed while the file never
        # reached an environment.
        #
        # It runs from /tmp on purpose. With the repository as the working
        # directory, `ckanext` imports from the source tree and the check
        # inspects the very files it is meant to be verifying were installed.
        run: |
          python -m venv /tmp/v && . /tmp/v/bin/activate
          pip install dist/*.tar.gz
          SRC="$PWD" python - <<'PY'
          import importlib.resources as r, os, pathlib, sys
          os.chdir("/tmp")
          src = pathlib.Path(os.environ["SRC"])
          missing = []
          for plugin in ("mwlr_datastore", "datasetapproval"):
              pkg = r.files(f"ckanext.{plugin}")
              base = src / "ckanext" / plugin
              for sub in ("templates", "public"):
                  for path in sorted((base / sub).rglob("*")):
                      if path.is_file() and not path.name.endswith(".pyc"):
                          rel = path.relative_to(base)
                          if not (pkg / str(rel)).is_file():
                              missing.append(f"{plugin}/{rel}")
          print(f"packaged files check: {'ok' if not missing else missing}")
          sys.exit(1 if missing else 0)
          PY
