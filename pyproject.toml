[project]
name = "ckanext-mwlr-datastore"
version = "2.1.0"
description = "The CKAN extension behind the Bioeconomy Science Institute research data catalogue: dataset schema, validators, theme, view counts and dataset approval"
readme = "README.md"
authors = [
    {name = "Bioeconomy Science Institute", email = "DataManager@landcareresearch.co.nz"}
]
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Framework :: CKAN",
]

keywords = [ "CKAN", ]
dependencies = []

[project.urls]
Homepage = "https://github.com/manaakiwhenua/ckanext-mwlr-datastore"
Issues = "https://github.com/manaakiwhenua/ckanext-mwlr-datastore/issues"

[project.entry-points."ckan.plugins"]
mwlr_datastore = "ckanext.mwlr_datastore.plugin:MwlrDatastorePlugin"
dataset_approval = "ckanext.datasetapproval.plugin:DatasetapprovalPlugin"


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
filterwarnings = [
        "ignore::sqlalchemy.exc.SADeprecationWarning",
        "ignore::sqlalchemy.exc.SAWarning",
        "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ckanext.mwlr_datastore" = ["scheming/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Errors and undefined names only to start; style rules can follow once the
# codebase is clean under them.
select = ["E", "F", "W"]
ignore = ["E501"]
