name: Pull request title

# We squash-merge, so the pull request title becomes the commit on main, and
# release-please reads that commit to decide the next version and write the
# changelog. A title outside Conventional Commits form is silently ignored by
# it: pull request #6 merged as "Fix  mwds 353 ..." (no type, no colon) and no
# release pull request opened. This check fails such a title before merge.
# CONTRIBUTING.md documents the form; the types are those in
# release-please-config.json plus the usual build/style/revert.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Title is in type(scope) form
        env:
          # Through the environment, never interpolated into the script - a
          # title is untrusted input.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|refactor|ci|chore|test|build|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
          else
            echo "::error::Pull request title must be Conventional Commits form, e.g. 'fix: MWDS-123 short description' - got: $TITLE"
            echo "See CONTRIBUTING.md. Allowed types: feat fix perf docs refactor ci chore test build style revert."
            exit 1
          fi
