name: Release pull request

# The release pull request model (CICD-ADR-010) on GitHub. Every merge to main
# updates one open pull request titled for the next version, computed from the
# conventional commits since the last release. Merging that pull request IS the
# release: it writes the version to pyproject.toml and CHANGELOG.md, tags
# vX.Y.Z and publishes the GitHub release. Nothing is ever pushed to main
# directly, so branch protection is untouched.
#
# Identity: a GitHub App owned by the organisation (not a person's token), so
# the release pull request triggers the test workflow and nothing expires with
# a staff member. Two settings on the repository:
#   variable RELEASE_APP_ID          the App's numeric id
#   secret   RELEASE_APP_PRIVATE_KEY the App's private key (PEM)
# Until they exist the job falls back to GITHUB_TOKEN, which still opens the
# release pull request but cannot make it run the checks.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mint an App token
        id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Point the release pull request at what it contains
        # The changelog's compare link (vLAST...vNEXT) is the permanent form and
        # only resolves once the tag exists, i.e. after the merge. While the pull
        # request is open, a reviewer wants vLAST...main, so append that as a
        # footer. release-please rewrites the body on every regeneration; this
        # runs after it each time, so the footer is always present and current.
        # prs_created is false when a merge leaves the release pull request
        # unchanged (a ci: or chore: commit), so look the open one up instead -
        # by its branch, not with --search or --author: those go through GitHub's
        # search index, which does not yet know a pull request release-please
        # opened a second earlier, so the footer was skipped whenever this run
        # was the one that created it (release 2.0.0).
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head release-please--branches--main--components--ckanext-mwlr-datastore --json number --jq '.[0].number // empty')
          [ -n "$number" ] || { echo "no open release pull request"; exit 0; }
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          body=$(gh pr view --repo "$GITHUB_REPOSITORY" "$number" --json body --jq '.body' | sed '/^<!-- contents -->$/,$d')
          printf '%s\n\n<!-- contents -->\n---\n**Before it merges**, what this release will contain is everything on `main` since %s: https://github.com/${{ github.repository }}/compare/%s...main (the changelog link above resolves once the tag exists).\n' "$body" "$last" "$last" > body.md
          gh pr edit --repo "$GITHUB_REPOSITORY" "$number" --body-file body.md
